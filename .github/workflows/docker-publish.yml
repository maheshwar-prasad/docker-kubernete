
name: Build and Publish Users Docker Image
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    tags:
      - 'v*'

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 23 (matches your pom.xml)
      - name: Setup Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
          cache-dependency-path: Users/pom.xml

      # 3. Build and run tests
      - name: Maven Build and Test
        working-directory: Users
        run: mvn -B clean verify

      # 4. Setup Docker Buildx
      - name: Setup Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3
      # 5. Login to Docker Hub (not needed for pull requests)
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
#      # 5. Login to GitHub Container Registry
#      - name: Login to GHCR
#        if: github.event_name != 'pull_request'
#        uses: docker/login-action@v3
#        with:
#          registry: ghcr.io
#          username: ${{ github.actor }}
#          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Generate Docker image tags
#      - name: Docker Metadata
#        if: github.event_name != 'pull_request'
#        id: meta
#        uses: docker/metadata-action@v5
#        with:
#          images: ghcr.io/${{ github.repository_owner }}/users-service
#          tags: |
#            type=raw,value=latest,enable={{is_default_branch}}
#            type=sha,prefix=sha-
#            type=semver,pattern={{version}}
#            type=semver,pattern={{major}}.{{minor}}
      # 6. Generate Docker image tags
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/users-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

#      # 7. Build and Push Docker Image
#      - name: Build and Push Image
#        if: github.event_name != 'pull_request'
#        uses: docker/build-push-action@v6
#        with:
#          context: ./Users
#          file: ./Users/Dockerfile-multi-stage
#          push: true
#          tags: ${{ steps.meta.outputs.tags }}
#          labels: ${{ steps.meta.outputs.labels }}
      # 7. Build and Push Docker Image
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./Users
          file: ./Users/Dockerfile-multi-stage
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
